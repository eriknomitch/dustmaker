<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DUSTMAKER</title>
  <style>
    :root {
      --bg: #000;
      --ink-bright: #ededed;
      --ink: #b6b6b6;
      --ink-dim: #767676;
      --line: #1a1a1a;
      --panel: rgba(6, 6, 6, 0.955);
      --panel-line: #3a3a3a;
      --alert: #ff2a1f;
      --accent: #35e0ff;
      --mono: ui-monospace, "SF Mono", "Geist Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg); color: var(--ink); font-family: var(--mono);
      font-size: 12px; height: 100vh; overflow: hidden;
    }
    .label {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    /* ---------- top bar ---------- */
    #topbar {
      position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 5;
      display: flex; align-items: stretch; background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    #topbar > div {
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 16px; border-right: 1px solid var(--line); gap: 2px;
    }
    #topbar .big { color: var(--ink-bright); font-size: 15px; letter-spacing: 0.06em; }
    #tb-title .big { letter-spacing: 0.28em; font-weight: bold; }
    #tb-defcon-pill {
      align-self: center; padding: 5px 12px; background: var(--alert); color: #000;
      font-weight: bold; letter-spacing: 0.14em; font-size: 12px;
    }
    #tb-defcon-pill.calm { background: transparent; color: var(--ink); border: 1px solid var(--panel-line); }
    #tb-seats { flex-direction: row !important; align-items: center; gap: 18px; }
    .seat-chip { display: flex; align-items: baseline; gap: 6px; }
    .seat-chip .diamond { font-size: 11px; }
    .seat-chip .score { color: var(--ink-bright); font-weight: bold; }
    .seat-chip .tag { font-size: 9px; letter-spacing: 0.14em; color: var(--ink-dim); }
    #topbar .spacer { flex: 1; border-right: none; }
    #tb-buttons { flex-direction: row !important; align-items: center; gap: 8px; border-right: none; }
    /* ---------- generic panel & buttons ---------- */
    .panel {
      background: var(--panel); border: 1px solid var(--line); padding: 10px 12px;
    }
    .panel h3 {
      font-size: 10px; letter-spacing: 0.18em; color: var(--ink-dim);
      text-transform: uppercase; padding-bottom: 8px; font-weight: normal;
    }
    .panel h3 b { color: var(--ink); }
    button {
      background: #0a0a0a; color: var(--ink); border: 1px solid var(--panel-line);
      font: inherit; font-size: 11px; padding: 6px 10px; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    button:hover { color: var(--ink-bright); border-color: var(--ink-dim); }
    button.small { padding: 3px 7px; font-size: 10px; }
    /* ---------- left column: forces ---------- */
    #forces { position: fixed; top: 68px; left: 14px; width: 200px; z-index: 4; }
    #forces .row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
    #forces .row .name { flex: 1; letter-spacing: 0.1em; }
    #forces .row .score { color: var(--ink-bright); }
    /* ---------- right column: orders + command ---------- */
    #right-col {
      position: fixed; top: 68px; right: 14px; width: 310px; z-index: 4;
      display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 200px);
    }
    #orders-panel { display: flex; flex-direction: column; min-height: 76px; overflow: hidden; }
    #orders { list-style: none; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 0; }
    #orders li {
      border: 1px solid var(--panel-line); padding: 7px 9px;
      display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;
    }
    #orders li.nuclear { border-color: var(--alert); background: rgba(255, 42, 31, 0.08); }
    #orders li .title { color: var(--ink-bright); letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }
    #orders li .desc { color: var(--ink-dim); font-size: 10px; margin-top: 3px; }
    #orders li button { border: none; background: none; padding: 0 2px; color: var(--ink-dim); }
    #orders li button:hover { color: var(--alert); }
    #orders .empty { color: var(--ink-dim); letter-spacing: 0.14em; text-align: center; padding: 14px 0; font-size: 10px; }
    #hint { color: var(--ink); font-size: 11px; min-height: 24px; padding-bottom: 6px; line-height: 1.5; }
    #actions { display: flex; flex-wrap: wrap; gap: 5px; }
    /* ---------- comms (bottom left) ---------- */
    #comms {
      position: fixed; bottom: 14px; left: 14px; width: 400px; z-index: 4;
      display: flex; flex-direction: column; max-height: 48vh;
    }
    #comms-log {
      overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      padding: 4px 0 10px; min-height: 90px;
    }
    .msg .who { font-size: 9px; letter-spacing: 0.16em; color: var(--ink-dim); padding-bottom: 3px; text-transform: uppercase; }
    .msg .who .ai { border: 1px solid var(--panel-line); padding: 1px 4px; margin-left: 6px; }
    .msg .text { color: var(--ink); line-height: 1.65; white-space: pre-wrap; font-size: 11.5px; }
    .msg.you .text { color: var(--ink-bright); }
    #comms-chips { display: flex; flex-wrap: wrap; gap: 5px; padding-bottom: 8px; }
    #comms-input-row { display: flex; gap: 6px; }
    #comms-input {
      flex: 1; background: #0a0a0a; border: 1px solid var(--panel-line); color: var(--ink-bright);
      font: inherit; padding: 7px 9px;
    }
    #comms-input::placeholder { color: var(--ink-dim); }
    /* ---------- commit (bottom right) ---------- */
    #commit-wrap { position: fixed; bottom: 14px; right: 14px; z-index: 4; text-align: right; }
    button.commit {
      background: #150403; border: 1px solid var(--alert); color: var(--ink-bright);
      padding: 14px 26px; font-size: 13px; font-weight: bold; letter-spacing: 0.16em;
    }
    button.commit:hover { background: #2a0805; }
    #commit-sub { padding-top: 7px; font-size: 10px; letter-spacing: 0.16em; color: var(--ink-dim); }
    /* ---------- map ---------- */
    #map { position: fixed; inset: 0; }
    #map canvas { cursor: grab; }
    #phase-banner {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 6;
      background: var(--panel); border: 1px solid var(--alert); color: var(--alert);
      padding: 6px 18px; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    /* ---------- modal ---------- */
    .modal-back {
      position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, 0.82);
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      background: var(--panel); border: 1px solid var(--panel-line);
      width: min(760px, 92vw); max-height: 84vh; display: flex; flex-direction: column;
    }
    .modal header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid var(--line);
    }
    .modal header .t { color: var(--ink-bright); letter-spacing: 0.22em; font-size: 14px; text-transform: uppercase; }
    .modal header .pill { border: 1px solid var(--alert); color: var(--alert); padding: 3px 10px; font-size: 10px; letter-spacing: 0.14em; }
    .modal .body { padding: 16px 18px; overflow-y: auto; line-height: 1.65; }
    .modal .body .phase { margin: 14px 0 4px; color: var(--ink-bright); letter-spacing: 0.18em; font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .modal .body .ev { color: var(--ink); padding: 3px 0 3px 12px; font-size: 11px; }
    .modal .body .ev.bad { color: var(--alert); }
    .modal footer { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
    .modal .sub { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.08em; padding-top: 4px; }
    .hidden { display: none !important; }
    #overlay .modal { text-align: center; padding: 40px 30px; gap: 20px; align-items: center; }
    #overlay h1 { letter-spacing: 0.4em; font-size: 26px; color: var(--ink-bright); }
    #overlay .sub { max-width: 460px; line-height: 1.7; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="phase-banner" class="hidden"></div>

  <div id="topbar">
    <div id="tb-title"><span class="big">DUSTMAKER</span><span class="label">world-v1 · vs ai</span></div>
    <div><span class="label">Round</span><span class="big" id="tb-round"></span></div>
    <div><span id="tb-defcon-pill"></span></div>
    <div id="tb-seats"></div>
    <div class="spacer"></div>
    <div id="tb-buttons">
      <button id="btn-sitrep">Sitrep</button>
    </div>
  </div>

  <div class="panel" id="forces"><h3>Forces</h3><div id="forces-rows"></div></div>

  <div id="right-col">
    <div class="panel" id="orders-panel">
      <h3>Orders <b id="orders-round"></b></h3>
      <ul id="orders"></ul>
    </div>
    <div class="panel" id="command-panel">
      <h3>Command</h3>
      <div id="hint"></div>
      <div id="actions"></div>
    </div>
  </div>

  <div class="panel" id="comms">
    <h3>Comms <b>— Chief of Staff</b></h3>
    <div id="comms-log"></div>
    <div id="comms-chips"></div>
    <div id="comms-input-row">
      <input id="comms-input" placeholder="Ask your Chief of Staff…" />
      <button id="comms-send">Send</button>
    </div>
  </div>

  <div id="commit-wrap">
    <button class="commit" id="commit">COMMIT ORDERS (0)</button>
    <div id="commit-sub"></div>
  </div>

  <div class="modal-back hidden" id="sitrep-back">
    <div class="modal">
      <header><span class="t">Sitrep — last round</span><span class="pill" id="sitrep-defcon"></span></header>
      <div class="body" id="log"></div>
      <footer><button id="sitrep-close">Take your turn</button></footer>
    </div>
  </div>

  <div class="modal-back" id="overlay">
    <div class="modal">
      <h1>DUSTMAKER</h1>
      <div class="sub" id="overlay-msg"></div>
      <footer style="border:none; justify-content:center"><button id="overlay-btn">START</button></footer>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
